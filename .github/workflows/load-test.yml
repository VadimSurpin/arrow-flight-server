name: Load Test

on:
  workflow_dispatch:
    inputs:
      scale_factor:
        description: "TPC-H scale factor (0.01 ≈ 10 MB, 0.1 ≈ 100 MB)"
        default: "0.1"
        required: true
      queries:
        description: "Comma-separated queries to compare (e.g. q1,q6,q14 or all)"
        default: "q1,q6,q14"
        required: true
      repetitions:
        description: "Query repetitions per engine (after one warmup run)"
        default: "3"
        required: true
      flight_batch_size:
        description: "Arrow Flight streaming batch size (rows)"
        default: "65536"
        required: false

env:
  # Use the default Ubuntu CDN — Yandex mirror is not reachable from GitHub runners.
  UBUNTU_MIRROR: http://archive.ubuntu.com/ubuntu
  # 3-node cluster.
  FLIGHT_HOSTS: flight-server-1,flight-server-2,flight-server-3
  FLIGHT_SERVERS: flight-server-1:32010,flight-server-2:32010,flight-server-3:32010
  FLIGHT_SERVER_DATA_DIRS: /server-data/server-node-1,/server-data/server-node-2,/server-data/server-node-3
  HDFS_BLOCK_SIZE_BYTES: "134217728"
  BENCHMARK_SCALE_FACTOR: ${{ inputs.scale_factor || '0.1' }}
  BENCHMARK_SCHEMA: tpch
  HDFS_DATA_DIR: hdfs://hdfs-namenode:8020/bench

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Patch arrowflight.properties for 3-node cluster
        run: |
          sed -i 's/^numServers=.*/numServers=3/' \
            src/main/resources/arrowflight.properties
          grep numServers src/main/resources/arrowflight.properties

      - name: Set up Docker Buildx with GHA cache support
        run: |
          docker buildx create \
            --use \
            --name ci-builder \
            --driver docker-container

      - name: Build main image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=arrowflight-main \
            --cache-to   type=gha,scope=arrowflight-main,mode=max \
            --build-arg  UBUNTU_MIRROR="${UBUNTU_MIRROR}" \
            --tag        arrowflight-test:latest \
            --load \
            -f docker/Dockerfile \
            .

      - name: Build DuckDB generator image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=arrowflight-generator \
            --cache-to   type=gha,scope=arrowflight-generator,mode=max \
            --tag        arrowflight-duckdb-benchmark-generator:latest \
            --load \
            -f benchmarks/benchbase-spark/duckdb-generator.Dockerfile \
            benchmarks/benchbase-spark

      - name: Start cluster (NameNode + Spark master + 3 Flight/DataNode nodes)
        run: |
          # Spark workers start AFTER data generation to keep RAM free for the
          # duckdb-benchmark-generator (needs up to 2 GB at SF=1).
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d hdfs-namenode spark-master \
                   server-node-1 server-node-2 server-node-3

      - name: Generate TPC-H data (SF=${{ inputs.scale_factor || '0.1' }})
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile benchbase \
            run --rm duckdb-benchmark-generator

      - name: Upload Parquet shards to HDFS and signal ready
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.ci.yml"

          # Wait for NameNode port to be reachable inside server-node-1.
          ${COMPOSE} exec -T server-node-1 bash -c '
            for i in $(seq 1 120); do
              bash -c "</dev/tcp/hdfs-namenode/8020" 2>/dev/null && exit 0
              sleep 2
            done
            echo "NameNode did not become reachable" >&2
            exit 1
          '

          # The generator shards data across all 3 staging volumes.
          # Upload each node's shard separately so HDFS gets the full dataset.
          cat > /tmp/hdfs_upload.sh << 'HDFSEOF'
          set -euo pipefail
          schema=tpch
          hdfs_root=hdfs://hdfs-namenode:8020/bench
          echo "[$(hostname)] uploading ${schema} shards from /staging/${schema}"
          hdfs dfs -mkdir -p "${hdfs_root}/${schema}"
          for table_dir in /staging/${schema}/*/; do
            [ -d "${table_dir}" ] || continue
            table="$(basename "${table_dir}")"
            mapfile -t parquets < <(find "${table_dir}" -maxdepth 1 -name '*.parquet' | sort)
            if [ ${#parquets[@]} -eq 0 ]; then
              echo "  ${table}: no parquet files — skipping"
              continue
            fi
            echo "  ${table}: ${#parquets[@]} file(s)"
            hdfs dfs -mkdir -p "${hdfs_root}/${schema}/${table}"
            hdfs dfs -put -f "${parquets[@]}" "${hdfs_root}/${schema}/${table}/"
          done
          echo "[$(hostname)] shard upload done."
          HDFSEOF

          for node in server-node-1 server-node-2 server-node-3; do
            ${COMPOSE} cp /tmp/hdfs_upload.sh ${node}:/tmp/hdfs_upload.sh
            ${COMPOSE} exec -T ${node} bash /tmp/hdfs_upload.sh
          done

          # Set replication=1 and signal all flight-node servers to start.
          ${COMPOSE} exec -T server-node-1 bash -c '
            hdfs dfs -setrep -w 1 hdfs://hdfs-namenode:8020/bench/tpch >/dev/null
            hdfs dfs -touchz hdfs://hdfs-namenode:8020/bench/_READY
            echo "HDFS upload complete."
            hdfs dfs -du -s -h hdfs://hdfs-namenode:8020/bench/tpch
          '

      - name: Start Spark workers (after data generation to save RAM)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d ci-worker-1 ci-worker-2 ci-worker-3

      - name: Wait for all 3 Arrow Flight servers to be ready
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          for node in server-node-1 server-node-2 server-node-3; do
            echo "Waiting for ${node} healthcheck (Flight on port 32010)..."
            container_id=$(${COMPOSE} ps -q "${node}")
            status=unknown
            for i in $(seq 1 120); do
              status=$(docker inspect \
                --format='{{.State.Health.Status}}' "${container_id}" \
                2>/dev/null || echo "missing")
              if [ "${status}" = "healthy" ]; then
                echo "  ${node} is healthy."
                break
              fi
              echo "  [${i}/120] ${node} status=${status} — retrying in 5 s..."
              sleep 5
            done
            if [ "${status}" != "healthy" ]; then
              echo "Timed out waiting for ${node}." >&2
              ${COMPOSE} logs "${node}" --tail=100
              exit 1
            fi
          done

      - name: Run Arrow Flight vs Direct HDFS comparison
        run: |
          mkdir -p benchmarks/ci/results
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile ci \
            run --rm \
            -e FLIGHT_BATCH_SIZE="${{ inputs.flight_batch_size || '65536' }}" \
            -e COMPARE_QUERIES="${{ inputs.queries || 'q1,q6,q14' }}" \
            -e COMPARE_REPETITIONS="${{ inputs.repetitions || '3' }}" \
            -e BENCHMARK_SCALE_FACTOR="${{ inputs.scale_factor || '0.1' }}" \
            ci-compare \
            | tee benchmarks/ci/results/compare-output.log

      - name: Post results to Job Summary
        if: always()
        run: |
          results=benchmarks/ci/results/compare-results.json
          if [ ! -f "${results}" ]; then
            echo "No results file found — comparison may have failed." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 benchmarks/ci/summarize.py "${results}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: load-test-results-sf${{ inputs.scale_factor || '0.1' }}
          path: benchmarks/ci/results/
          if-no-files-found: warn

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            logs --tail=300 2>&1 | tail -500
