name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  build-server:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - run: mvn clean compile -pl flight-server --batch-mode --errors --fail-at-end
      - run: test -f flight-server/target/classes/pro/surpin/data/arrowflight/server/HadoopArrowFlightServer.class

  build-client:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - run: mvn clean compile -pl flight-spark -am --batch-mode --errors --fail-at-end
      - run: test -f flight-spark/target/classes/pro/surpin/data/arrowflight/client/spark/FlightSource.class

  lint:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - run: mvn compile checkstyle:check --batch-mode --errors --fail-at-end
      - run: mvn spotbugs:check --batch-mode --errors --fail-at-end
        if: always()

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - run: ./mvnw test --batch-mode --errors --fail-at-end

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - run: mvn test -P integration --batch-mode --errors --fail-at-end

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode clean verify -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Generate JaCoCo badge SVG
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2
        with:
          generate-branches-badge: true
          badges-directory: flight-server/target/site/jacoco
          coverage-label: JaCoCo
        if: always()

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-report
          path: |
            flight-server/target/site/jacoco/
            flight-spark/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: PR coverage comment
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: flight-server/target/site/jacoco/jacoco.xml,flight-spark/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: "JaCoCo Coverage Report — [HTML Report](https://VadimSurpin.github.io/arrow-flight-server/pr-${{ github.event.number }}/jacoco/)"
          update-comment: true
        continue-on-error: true
        if: github.event_name == 'pull_request'

      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        continue-on-error: true
        if: always()
        with:
          file: flight-server/target/site/jacoco/jacoco.xml
          format: jacoco
          base-path: /flight-server/src/main/java
          flag-name: server
          parallel: true

      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        continue-on-error: true
        if: always()
        with:
          file: flight-spark/target/site/jacoco/jacoco.xml
          format: jacoco
          base-path: /flight-spark/src/main/java
          flag-name: spark
          parallel: true

      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        continue-on-error: true
        if: always()
        with:
          parallel-finished: true

      - name: Deploy JaCoCo report to gh-pages (main)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flight-server/target/site/jacoco
          destination_dir: jacoco

      - name: Deploy Spark JaCoCo report to gh-pages (main)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flight-spark/target/site/jacoco
          destination_dir: jacoco-spark

      - name: Deploy JaCoCo report to gh-pages (PR)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: github.event_name == 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flight-server/target/site/jacoco
          destination_dir: pr-${{ github.event.number }}/jacoco

      - name: Deploy Spark JaCoCo report to gh-pages (PR)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: github.event_name == 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flight-spark/target/site/jacoco
          destination_dir: pr-${{ github.event.number }}/jacoco-spark
