name: Build StarRocks images

# Builds the StarRocks fork (stock commit + starrocks-fork/flight-connector.patch) and pushes FE and BE runtime
# images to ghcr.io. Uses the same compiler-cache key as the native E2E workflow, so a build of an unchanged patch
# is mostly cache hits.
on:
  workflow_dispatch:
  push:
    branches: [feat/starrocks-native-integration]
    paths:
      - ".github/workflows/starrocks-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: starrocks-images-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_ENV_IMAGE: starrocks/dev-env-ubuntu:4.0-latest

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h / | cat

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install the connector jar the fork's FE depends on
        run: ./mvnw -B -q install -DskipTests -pl flight-starrocks -am

      - name: Check out stock StarRocks and apply the fork patch
        run: |
          base="$(cat starrocks-fork/BASE_SHA)"
          mkdir starrocks && cd starrocks
          git init -q
          git remote add origin https://github.com/StarRocks/starrocks.git
          git fetch --depth 1 origin "$base"
          git checkout -q FETCH_HEAD
          git -c user.name=ci -c user.email=ci@example.com am "$GITHUB_WORKSPACE/starrocks-fork/flight-connector.patch"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ hashFiles('starrocks-fork/BASE_SHA') }}-${{ hashFiles('starrocks-fork/flight-connector.patch') }}
          restore-keys: |
            ccache-${{ hashFiles('starrocks-fork/BASE_SHA') }}-

      - name: Kernel settings and swap
        run: |
          sudo sysctl -w vm.max_map_count=262144
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile

      - name: Start the dev-env container
        run: |
          mkdir -p ~/.ccache ~/.m2
          docker pull "$DEV_ENV_IMAGE"
          docker run -d --name sr --network host --ulimit nofile=655350:655350 --ulimit core=-1 \
            -v "$PWD/starrocks:/root/starrocks" -v "$HOME/.m2:/root/.m2" -v "$HOME/.ccache:/root/.ccache" \
            "$DEV_ENV_IMAGE" sleep infinity

      - name: Build FE and BE
        run: |
          docker exec -e CCACHE_DIR=/root/.ccache -e CCACHE_MAXSIZE=5G sr bash -lc '
            cd /root/starrocks &&
            ./build.sh --fe --be --without-java-ext --without-tenann -j2 &&
            ccache -s | head -8'
          df -h / | cat

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ hashFiles('starrocks-fork/BASE_SHA') }}-${{ hashFiles('starrocks-fork/flight-connector.patch') }}-${{ github.run_id }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push FE and BE images
        run: |
          sudo chown -R "$USER" starrocks/output || true
          cd starrocks
          for c in fe be; do
            docker build --build-arg ARTIFACT_SOURCE=local --build-arg LOCAL_REPO_PATH=. \
              -f docker/dockerfiles/$c/$c-ubuntu.Dockerfile \
              -t ghcr.io/vadimsurpin/starrocks-bench-$c:${GITHUB_SHA::12} -t ghcr.io/vadimsurpin/starrocks-bench-$c:latest .
            docker push --all-tags ghcr.io/vadimsurpin/starrocks-bench-$c
          done
