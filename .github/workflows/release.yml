name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and test
        run: mvn --batch-mode clean verify -P integration

      - name: Upload shaded JAR to GitHub Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arrow-flight-server-${{ env.RELEASE_VERSION }}
          path: |
            flight-server/target/arrow-flight-server-*-shaded.jar
            flight-spark/target/arrow-flight-spark-connector-*-shaded.jar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Arrow Flight Server $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            flight-server/target/arrow-flight-server-*-shaded.jar \
            flight-spark/target/arrow-flight-spark-connector-*-shaded.jar
