name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and test
        run: mvn --batch-mode clean verify -P integration

      - name: Upload shaded JAR to GitHub Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arrow-flight-server-${{ env.RELEASE_VERSION }}
          path: target/arrow-flight-server-*-shaded.jar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Arrow Flight Server $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            target/arrow-flight-server-*-shaded.jar
