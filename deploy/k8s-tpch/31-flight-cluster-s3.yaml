# 3-node Flight SQL cluster that reads the SF100 Parquet files straight from MinIO (no local copy): the Hadoop s3a
# filesystem lists files and reads footers, DuckDB httpfs scans the data. Replaces 30-flight-cluster.yaml, which
# mirrors the files to a PVC per pod. Switching between them needs `kubectl delete sts flight` first because the
# volumeClaimTemplates differ.
apiVersion: v1
kind: Service
metadata: {name: flight, namespace: tpch-bench}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: flight}
  ports: [{name: grpc, port: 32010}, {name: hazelcast, port: 5701}, {name: metrics, port: 9404}]
---
llel
  selector: {matchLabels: {app: flight}}
  template:
    metadata: {labels: {app: flight}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [compute1, compute2, compute3]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: flight}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: flight
          image: ghcr.io/vadimsurpin/arrowflight-bench:latest
          imagePullPolicy: Always
          env:
            - {name: FLIGHT_DATA_DIR, value: "s3a://tpch"}
            - {name: FLIGHT_ALLOW_INSECURE, value: "true"}
            - {name: FLIGHT_S3_ENDPOINT, value: "http://minio:9000"}
            - name: FLIGHT_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: minio-creds, key: MINIO_ROOT_USER}}
            - name: FLIGHT_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: minio-creds, key: MINIO_ROOT_PASSWORD}}
            - {name: FLIGHT_HOSTS, value: "flight-0.flight,flight-1.flight,flight-2.flight"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: FLIGHT_LOCALHOST, value: "$(POD_NAME).flight"}
            - {name: FLIGHT_LOCAL_STORAGE_HOST, value: "$(POD_NAME).flight"}
            # glibc keeps one arena per thread; with 8 DuckDB threads the freed memory fragments across them
            - {name: MALLOC_ARENA_MAX, value: "2"}
            - {name: JAVA_OPTS, value: "-Xmx2g -XX:MaxDirectMemorySize=6g -DduckDbMemoryLimit=3GB -DduckDbThreads=8 -DendpointsPerServer=3 -DarrowAllocatorLimitBytes=5000000000 -DdecimalWire=narrow"}
          ports: [{containerPort: 32010, name: grpc}, {containerPort: 5701, name: hazelcast}, {containerPort: 9404, name: metrics}]
          resources:
            requests: {cpu: "4", memory: 12Gi}
            limits: {cpu: "8", memory: 18Gi}
          readinessProbe: {tcpSocket: {port: 32010}, periodSeconds: 5, failureThreshold: 60}
